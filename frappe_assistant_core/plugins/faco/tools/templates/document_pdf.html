<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* ---------------------------------------------------------------------
   Page layout
   ---------------------------------------------------------------------
   The renderer is WeasyPrint where the server has its system libraries and
   wkhtmltopdf (a 2011-era WebKit) otherwise, so everything below sticks to
   CSS both understand: no flexbox, gap, vh units or unprefixed gradients.

   WeasyPrint takes margins and the footer from @page; wkhtmltopdf ignores
   @page and gets the same margins and a page-number footer as options in
   generate_document._generate_pdf. Margins live only on the page: setting
   them on the content as well doubled them.
*/
@page {
	size: {{ page_size or 'A4' }} {{ 'landscape' if orientation == 'Landscape' else 'portrait' }};
	margin: {{ margins.top }} {{ margins.right }} {{ margins.bottom }} {{ margins.left }};

	@bottom-right {
		content: counter(page) " / " counter(pages);
		font-family: "Inter", "Noto Sans", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
		font-size: 8pt;
		color: #9ca3af;
	}

	@bottom-left {
		content: "{{ (title or '') | replace('"', '') }}";
		font-family: "Inter", "Noto Sans", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
		font-size: 8pt;
		color: #9ca3af;
	}
}

/* The cover page keeps the normal margins (so it is the same in both
   renderers) but drops the footer. */
@page cover {
	@bottom-right { content: none; }
	@bottom-left { content: none; }
}

/* ---------------------------------------------------------------------
   Base typography
   --------------------------------------------------------------------- */
body {
	font-family: "Inter", "Noto Sans", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
	font-size: 10.5pt;
	margin: 0;
	line-height: 1.6;
	color: #1a1a1a;
}

/* Document title (when no cover page is used) */
.doc-title {
	font-size: 22pt;
	font-weight: 700;
	color: #111;
	margin: 0 0 4px 0;
	padding-bottom: 10px;
	border-bottom: 3px solid #5470c6;
	letter-spacing: -0.02em;
}

.doc-subtitle {
	font-size: 9pt;
	color: #666;
	margin: 0 0 24px 0;
}

/* Headings */
h1 { font-size: 17pt; font-weight: 700; color: #111; margin: 28px 0 10px; letter-spacing: -0.01em; }
h2 { font-size: 13pt; font-weight: 600; color: #1f2937; margin: 22px 0 8px; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
h3 { font-size: 11.5pt; font-weight: 600; color: #374151; margin: 16px 0 6px; }
h4 { font-size: 10.5pt; font-weight: 600; color: #4b5563; margin: 12px 0 4px; }

/* Headings don't get orphaned at the bottom of a page. */
h1, h2, h3, h4 { page-break-after: avoid; break-after: avoid; }

/* Paragraphs */
p { margin: 0 0 10px; orphans: 3; widows: 3; }

/* Lists. A blank line between two items makes markdown wrap every item of
   that list in <p>, so paragraph spacing inside items is removed: a list is
   spaced the same however it was typed. */
ul, ol { margin: 0 0 10px; padding-left: 24px; }
li { margin-bottom: 4px; }
li > p { margin: 0; }
li > ul, li > ol { margin: 4px 0 0; }

/* ---------------------------------------------------------------------
   Tables
   --------------------------------------------------------------------- */
table {
	width: 100%;
	border-collapse: collapse;
	margin: 14px 0;
	font-size: 9.5pt;
}

/* A table taller than a page has to split; keep each row whole instead. */
tr { page-break-inside: avoid; }

thead {
	display: table-header-group; /* repeat header on page break */
}

thead th {
	background: #f3f4f6;
	font-weight: 600;
	text-align: left;
	padding: 8px 10px;
	border: 1px solid #d1d5db;
	color: #1f2937;
}

tbody td {
	padding: 7px 10px;
	border: 1px solid #e5e7eb;
	vertical-align: top;
}

tbody tr:nth-child(even) { background: #fafafa; }

/* Column alignment from the markdown (|--:|), carried as the align attribute. */
th[align="right"], td[align="right"] { text-align: right; }
th[align="center"], td[align="center"] { text-align: center; }

/* ---------------------------------------------------------------------
   Code
   --------------------------------------------------------------------- */
code {
	font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, "Courier New", monospace;
	font-size: 9pt;
	background: #f3f4f6;
	padding: 1px 4px;
	border-radius: 3px;
	border: 1px solid #e5e7eb;
}

pre {
	background: #f9fafb;
	padding: 12px 14px;
	border-radius: 4px;
	border: 1px solid #e5e7eb;
	overflow-x: auto;
	margin: 12px 0;
	font-size: 8.5pt;
	line-height: 1.5;
	page-break-inside: avoid;
}

pre code { background: none; padding: 0; border: none; border-radius: 0; }

/* Blockquotes */
blockquote {
	margin: 12px 0;
	padding: 8px 14px;
	border-left: 3px solid #9ca3af;
	color: #4b5563;
	background: #f9fafb;
	font-style: italic;
}
blockquote p:last-child { margin-bottom: 0; }

hr { border: none; border-top: 1px solid #e5e7eb; margin: 18px 0; }

a { color: #3d56a8; text-decoration: none; }

strong { font-weight: 600; }
em { font-style: italic; }
s, del { text-decoration: line-through; color: #6b7280; }

/* ---------------------------------------------------------------------
   Cover page
   --------------------------------------------------------------------- */
/* Fills the area inside the page margins; the height and the top padding that
   sets the text a third of the way down are computed for the page size and
   orientation in generate_document, because neither flexbox nor a stretched
   table cell centres it in both renderers. The solid colour comes first so
   wkhtmltopdf, which only knows the -webkit- gradient, never falls back to
   white text on white. */
.cover-page {
	page: cover;
	page-break-after: always;
	break-after: page;
	box-sizing: border-box;
	width: 100%;
	height: {{ cover_height }};
	padding-top: {{ cover_padding_top }};
	background-color: #3d56a8;
	background-image: -webkit-linear-gradient(315deg, #2e4387 0%, #3d56a8 55%, #5470c6 100%);
	background-image: linear-gradient(135deg, #2e4387 0%, #3d56a8 55%, #5470c6 100%);
	border-radius: 8px;
	color: white;
	text-align: center;
}

.cover-inner { padding: 0 12%; }

.cover-title {
	font-size: 36pt;
	font-weight: 700;
	margin: 0 0 12px 0;
	letter-spacing: -0.02em;
	color: white;
	border: none;
	padding: 0;
}

.cover-subtitle {
	font-size: 14pt;
	font-weight: 400;
	margin: 0 0 40px 0;
	opacity: 0.9;
}

.cover-meta {
	margin-top: 60px;
	font-size: 10pt;
	opacity: 0.8;
	letter-spacing: 0.05em;
	text-transform: uppercase;
}
.cover-meta div { margin: 4px 0; }

/* Explicit page break utility */
.page-break {
	page-break-before: always;
	break-before: page;
	height: 0;
}

/* ---------------------------------------------------------------------
   Callout — info / tip / warning / success / error
   --------------------------------------------------------------------- */
.callout {
	display: table;
	width: 100%;
	box-sizing: border-box;
	margin: 14px 0;
	padding: 12px 14px;
	border-left: 4px solid #5470c6;
	border-radius: 4px;
	page-break-inside: avoid;
}

.callout-icon {
	display: table-cell;
	width: 16px;
	padding: 2px 10px 0 0;
	vertical-align: top;
}

.callout-icon svg { display: block; }

.callout-body { display: table-cell; vertical-align: top; }
.callout-title { font-weight: 600; color: #111; margin-bottom: 4px; font-size: 10.5pt; }
.callout-body p { margin: 0 0 6px; }
.callout-body p:last-child { margin-bottom: 0; }

/* ---------------------------------------------------------------------
   Metric card
   --------------------------------------------------------------------- */
/* Fixed width, three to a row: cards sized to their content wrapped 2 + 1. */
.metric-card {
	display: inline-block;
	width: 30.5%;
	box-sizing: border-box;
	margin: 8px 2% 8px 0;
	padding: 14px 16px;
	border: 1px solid #e5e7eb;
	border-radius: 6px;
	background: #fafafa;
	vertical-align: top;
	page-break-inside: avoid;
}

.metric-title {
	font-size: 8.5pt;
	color: #6b7280;
	text-transform: uppercase;
	letter-spacing: 0.05em;
	margin-bottom: 4px;
}

.metric-value {
	font-size: 18pt;
	font-weight: 700;
	color: #111;
	letter-spacing: -0.02em;
	line-height: 1.1;
}

.metric-change {
	display: inline-block;
	margin-top: 4px;
	font-size: 9pt;
	font-weight: 600;
}

.metric-arrow { vertical-align: middle; }

.metric-description {
	margin-top: 4px;
	font-size: 8.5pt;
	color: #6b7280;
}

/* ---------------------------------------------------------------------
   Charts
   --------------------------------------------------------------------- */
.chart-wrap {
	margin: 16px 0;
	padding: 14px;
	background: white;
	border: 1px solid #e5e7eb;
	border-radius: 6px;
	page-break-inside: avoid;
}

.chart-title {
	font-size: 11pt;
	font-weight: 600;
	color: #1f2937;
	margin-bottom: 8px;
}

/* Capped near the portrait column width, so a landscape page shows a chart
   the same size instead of one tall enough to need a page of its own. */
.chart-svg {
	display: block;
	width: 100%;
	max-width: 170mm;
	height: auto;
	margin: 0 auto;
}

.chart-legend {
	margin-top: 8px;
	font-size: 9pt;
	color: #4b5563;
	text-align: center;
}

.legend-item {
	display: inline-block;
	margin: 0 10px;
	vertical-align: middle;
}

.legend-swatch {
	display: inline-block;
	width: 10px;
	height: 10px;
	margin-right: 5px;
	border-radius: 2px;
	vertical-align: middle;
}

.chart-error {
	padding: 12px;
	color: #b91c1c;
	background: #fef2f2;
	border: 1px solid #fecaca;
	border-radius: 4px;
	font-size: 9.5pt;
}

/* ---------------------------------------------------------------------
   Footer (only used when @page footers aren't honoured by renderer)
   --------------------------------------------------------------------- */
.doc-footer {
	margin-top: 32px;
	padding-top: 8px;
	border-top: 1px solid #e5e7eb;
	font-size: 8pt;
	color: #999;
	text-align: right;
}

/* ---------------------------------------------------------------------
   Images
   --------------------------------------------------------------------- */
img {
	max-width: 100%;
	height: auto;
	page-break-inside: avoid;
}
</style>
</head>
<body>
<div class="print-format">
	{# A cover page already shows the title; a header as well gave it a page of its own. #}
	{% if title and not has_cover %}
	<h1 class="doc-title">{{ title }}</h1>
	{% endif %}
	{% if subtitle %}
	<p class="doc-subtitle">{{ subtitle }}</p>
	{% endif %}

	{{ body }}

	{% if generated_date %}
	<div class="doc-footer">Generated on {{ generated_date }}</div>
	{% endif %}
</div>
</body>
</html>
