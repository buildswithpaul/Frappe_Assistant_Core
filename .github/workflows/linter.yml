name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

      # The Frappe Marketplace gates every release PR on its own rule set, which is
      # not the one above. Same blocking rule as validation/semgrep_check.py there:
      # is_blocking metadata, or a severity that maps to Critical/Major.
      - name: Download Marketplace Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/marketplace.git frappe-marketplace

      - name: Run Marketplace Semgrep rules
        run: |
          semgrep scan --config ./frappe-marketplace/validation/semgrep-rules \
            --exclude frappe-marketplace --exclude frappe-semgrep-rules \
            --json --quiet . > marketplace-semgrep.json
          jq -r '.results[]
            | select(.extra.metadata.is_blocking == true
                or (.extra.severity | ascii_upcase | IN("CRITICAL", "ERROR", "HIGH")))
            | "\(.path):\(.start.line) \(.check_id | split(".") | last)"' \
            marketplace-semgrep.json > marketplace-blocking.txt
          if [ -s marketplace-blocking.txt ]; then
            echo "::error::Findings that would block the Frappe Marketplace release PR:"
            cat marketplace-blocking.txt
            exit 1
          fi

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .